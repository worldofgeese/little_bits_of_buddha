[environment]
python-version = "3.13"
# python = ".venv/bin/python"  # Only works locally; CI uses system Python
# ty auto-discovers the environment when this is omitted

[rules]
# Dapr actor stubs use empty bodies with return types for interface definition
empty-body = "ignore"
# trio.to_thread.run_sync type stubs are incomplete in ty
call-non-callable = "warn"
# dapr.ext.workflow not always installable in CI (namespace package issues)
unresolved-import = "warn"
# redis-py type stubs incomplete for RediSearch create_index
invalid-argument-type = "warn"
