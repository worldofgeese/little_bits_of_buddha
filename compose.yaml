# Little Bits of Buddha - Local Stack
#
# Development:
#   Open in VS Code → "Reopen in Container"
#   Inside container: devbox shell, then dapr run -f dapr.yaml
#
# Production:
#   podman-compose --profile production up -d
#
# Required env vars for production:
#   TELEGRAM_BOT_TOKEN   - Telegram bot token
#   ANTHROPIC_AUTH_TOKEN  - Anthropic proxy Bearer token

services:
  # Development container
  devcontainer:
    image: localhost/little_bits_of_buddha-devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    volumes:
      - .:/workspaces/little_bits_of_buddha:cached,Z
    depends_on:
      - redis
    command: sleep infinity
    profiles:
      - dev

  redis:
    image: redis/redis-stack-server:latest
    container_name: lbob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Production services (podman-compose --profile production up -d) ---

  # Dapr sidecar for telegram-bot-service
  telegram-bot-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-telegram-dapr
    command:
      - ./daprd
      - --app-id=telegram-bot-service
      - --app-port=8090
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    network_mode: "service:telegram-bot-service"
    depends_on:
      telegram-bot-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  telegram-bot-service:
    image: lbob-telegram:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram-bot-service-production
    container_name: lbob-telegram
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TRIOGRAM_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "8090:8090"
    restart: unless-stopped
    profiles:
      - production

  # Dapr sidecar for openai-service
  openai-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-openai-dapr
    command:
      - ./daprd
      - --app-id=openai-service
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    network_mode: "service:openai-service"
    depends_on:
      openai-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  openai-service:
    image: lbob-openai:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: openai-service-production
    container_name: lbob-openai
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - LITELLM_MODEL=anthropic/anthropic.claude-sonnet-4-5-20250929-v1:0
      - REDIS_HOST=lbob-redis
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - production

  # --- Log shipping ---
  loki:
    image: docker.io/grafana/loki:3.3.2
    container_name: lbob-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    profiles:
      - production

  promtail:
    image: docker.io/grafana/promtail:3.3.2
    container_name: lbob-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro,Z
      - /run/podman/podman.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:
  loki_data:
