# Little Bits of Buddha - Local Stack
#
# Development:
#   Open in VS Code → "Reopen in Container"
#   Inside container: devbox shell, then dapr run -f dapr.yaml
#
# Production:
#   podman-compose --profile production up -d

services:
  # Development container
  devcontainer:
    image: localhost/little_bits_of_buddha-devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    volumes:
      - .:/workspaces/little_bits_of_buddha:cached,Z
    depends_on:
      - redis
    command: sleep infinity

  redis:
    image: redis:7-alpine
    container_name: lbob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # For containerized deployment (alternative to dapr run -f):
  telegram-bot-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram-bot-service-production
    container_name: lbob-telegram
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TRIOGRAM_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "8090:8090"
    restart: unless-stopped
    profiles:
      - production

  openai-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: openai-service-production
    container_name: lbob-openai
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:
