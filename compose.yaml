# Little Bits of Buddha - Local Stack
#
# Development:
#   Open in VS Code → "Reopen in Container"
#   Inside container: devbox shell, then dapr run -f dapr.yaml
#
# Production:
#   podman-compose --profile production up -d
#
# Required env vars for production:
#   TELEGRAM_BOT_TOKEN   - Telegram bot token
#   ANTHROPIC_AUTH_TOKEN  - Anthropic proxy Bearer token
#   ANTHROPIC_BASE_URL   - Anthropic proxy endpoint

services:
  # Development container
  devcontainer:
    image: localhost/little_bits_of_buddha-devcontainer
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    volumes:
      - .:/workspaces/little_bits_of_buddha:cached,Z
    depends_on:
      - redis
    command: sleep infinity
    profiles:
      - dev

  redis:
    image: redis/redis-stack-server:latest
    container_name: lbob-redis
    networks:
      - lbob
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Production services (podman-compose --profile production up -d) ---

  # Dapr sidecar for telegram-bot-service
  telegram-bot-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-telegram-dapr
    networks:
      - lbob
    command:
      - ./daprd
      - --app-id=telegram-bot-service
      - --app-channel-address=lbob-telegram
      - --app-port=8090
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  telegram-bot-service:
    image: lbob-telegram:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram-bot-service-production
    container_name: lbob-telegram
    networks:
      - lbob
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TRIOGRAM_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DAPR_HTTP_ENDPOINT=http://lbob-telegram-dapr:3500
      - DAPR_GRPC_ENDPOINT=lbob-telegram-dapr:50001
    ports:
      - "8090:8090"
    restart: unless-stopped
    profiles:
      - production

  # --- Seeker Actor Service (hosts Dapr Actors) ---
  seeker-actor-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-seeker-actor-dapr
    networks:
      - lbob
    command:
      - ./daprd
      - --app-id=seeker-actor-service
      - --app-channel-address=lbob-seeker-actor
      - --app-port=8081
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  seeker-actor-service:
    image: lbob-seeker-actor:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: seeker-actor-service-production
    container_name: lbob-seeker-actor
    networks:
      - lbob
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DAPR_HTTP_ENDPOINT=http://lbob-seeker-actor-dapr:3500
      - DAPR_GRPC_ENDPOINT=lbob-seeker-actor-dapr:50001
    ports:
      - "8081:8081"
    restart: unless-stopped
    profiles:
      - production

  # --- Wisdom Service (LLM + RAG, stateless) ---
  wisdom-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-wisdom-dapr
    networks:
      - lbob
    command:
      - ./daprd
      - --app-id=wisdom-service
      - --app-channel-address=lbob-wisdom
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  wisdom-service:
    image: lbob-wisdom:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: wisdom-service-production
    container_name: lbob-wisdom
    networks:
      - lbob
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - LITELLM_MODEL=anthropic/anthropic.claude-sonnet-4-5-20250929-v1:0
      - REDIS_HOST=lbob-redis
      - DAPR_HTTP_ENDPOINT=http://lbob-wisdom-dapr:3500
      - DAPR_GRPC_ENDPOINT=lbob-wisdom-dapr:50001
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - production

  # --- Meditation Workflow Service (Dapr Workflows for guided meditation) ---
  meditation-workflow-dapr:
    image: lbob-daprd:latest
    build:
      context: .
      dockerfile: Dockerfile.daprd
    container_name: lbob-meditation-workflow-dapr
    networks:
      - lbob
    command:
      - ./daprd
      - --app-id=meditation-workflow-service
      - --app-channel-address=lbob-meditation-workflow
      - --app-port=8003
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --log-level=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production

  meditation-workflow-service:
    image: lbob-meditation-workflow:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: meditation-workflow-service-production
    container_name: lbob-meditation-workflow
    networks:
      - lbob
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DAPR_HTTP_ENDPOINT=http://lbob-meditation-workflow-dapr:3500
      - DAPR_GRPC_ENDPOINT=lbob-meditation-workflow-dapr:50001
    ports:
      - "8003:8003"
    restart: unless-stopped
    profiles:
      - production

  # --- Log shipping ---
  loki:
    image: docker.io/grafana/loki:3.3.2
    container_name: lbob-loki
    networks:
      - lbob
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    profiles:
      - production

  promtail:
    image: docker.io/grafana/promtail:3.3.2
    container_name: lbob-promtail
    networks:
      - lbob
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro,Z
      - /run/podman/podman.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - production

networks:
  lbob:
    driver: bridge

volumes:
  redis_data:
  loki_data:
