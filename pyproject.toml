[project]
name = "little_bits_of_buddha"
version = "0.1.0"
description = "A Telegram bot that interacts with its users as if it were the Buddha"
authors = [
  { name="Tao Hansen", email="5-worldofgeese@users.noreply.gitlab.hansen.agency" },
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "AGPL-3.0+"}
keywords = [
    "ai",
    "openai",
    "chatbot",
    "telegram",
    "buddhism",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Religion",
    "Framework :: FastAPI",
    "Topic :: Religion",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
    "hypercorn>=0.14.3",
    "fastapi>=0.97.0",
    "dapr>=1.10.0",
    "dapr-ext-fastapi>=1.10.0",
    "litellm>=1.0.0",
    "requests>=2.31.0",
    "trio>=0.22.1",
    "redis>=5.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0", "pytest-mock>=3.11.1"]
dev = ["ruff>=0.9.0", "ty>=0.0.1", "prek>=0.3.0"]

[project.urls]
"Homepage" = "https://paphos.hound-celsius.ts.net/kypris/little_bits_of_buddha"
"Bug Tracker" = "https://paphos.hound-celsius.ts.net/kypris/little_bits_of_buddha/issues"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]

[tool.pdm.dev-dependencies]
dev = [
    "-e file:///${PROJECT_ROOT}/src/openai_service_worldofgeese#egg=openai-service-worldofgeese",
    "-e file:///${PROJECT_ROOT}/src/telegram_bot_service_worldofgeese#egg=telegram-bot-service-worldofgeese",
    "debugpy>=1.6.7.post1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "pytest>=7.4.0",
    "git-filter-repo>=2.38.0",
]
# triogram depends on a very old version of h11 that doesn't work with the latest hypercorn
[tool.pdm.resolution.overrides]
h11 = ">=0.14.0"
httpx = ">=0.24.1"
trio = ">=0.22.0"

[tool.pdm.options]
# install = ["--installer", "uv"]  # Disabled: requires PDM >= 2.12

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


# "The path entries are calculated relative to the rootdir, thus the src entry adds path/to/project/src directory to sys.path in this case."
# https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "src"
]
markers = [
  "integration: tests that depend on local files (Dapr components, secrets)",
]
