repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix src/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: ruff format src/
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty check
        entry: ty check src/
        language: system
        pass_filenames: false
        always_run: true
