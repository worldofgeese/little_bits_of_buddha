name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.11-slim

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout code
        run: |
          git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git repo
          cd repo && git checkout ${{ github.sha }} || true

      - name: Run tests
        run: |
          cd repo
          pip install -q -e ".[test]"
          pytest -m "not integration" -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.11-slim

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout code
        run: |
          git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git repo
          cd repo && git checkout ${{ github.sha }} || true

      - name: Run ruff and ty
        run: |
          cd repo
          pip install -q -e ".[dev]"
          ruff check src/
          ty check src/

  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    container:
      image: quay.io/podman/stable:latest
      options: --privileged

    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout code
        run: |
          git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git repo
          cd repo && git checkout ${{ github.sha }} || true

      - name: Build container image
        run: |
          cd repo
          podman build --storage-driver=vfs -t little-bits-of-buddha:${{ github.sha }} -f Containerfile .
