name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: -self-hosted
    steps:
      - name: Setup and test
        run: |
          cd "${PROJECT_DIR:-.}"
          python3 -m venv .venv --clear
          . .venv/bin/activate
          pip install -q -e ".[test]"
          pytest -v
        shell: bash

  lint:
    runs-on: -self-hosted
    steps:
      - name: Setup and lint
        run: |
          cd "${PROJECT_DIR:-.}"
          python3 -m venv .venv --clear
          . .venv/bin/activate
          pip install -q -e ".[dev]"
          pyright src/
        shell: bash
