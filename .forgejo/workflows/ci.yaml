name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: -self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.11.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: devbox run install

      - name: Run tests
        run: devbox run -- pytest -v

  lint:
    runs-on: -self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.11.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: devbox run install

      - name: Type check
        run: devbox run -- pyright src/
