name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
        shell: bash

      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA" 2>/dev/null || true
        shell: bash

      - name: Test
        run: sh scripts/run-tests.sh
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
        shell: bash

      - name: Checkout
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA" 2>/dev/null || true
        shell: bash

      - name: Lint
        run: sh scripts/run-lint.sh
        shell: bash

  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    container:
      image: quay.io/podman/stable:latest
      options: --privileged
    steps:
      - name: Checkout
        run: |
          dnf install -y git
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA" 2>/dev/null || true
        shell: bash

      - name: Build container
        run: sh scripts/run-build.sh
        shell: bash
